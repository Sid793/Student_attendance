# ===================================================================
# Student Attendance and Performance Tracking System - Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=student-attendance-system

# MySQL Database Configuration
# NOTE: Update the username and password according to your local MySQL installation.
# By default, createDatabaseIfNotExist=true will automatically create the database if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/student_attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable SQL script initialization (optional, if you want sample data loaded)
# spring.sql.init.mode=always

# JWT Configuration
# 256-bit secret key for HMAC-SHA256 signing
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity: 86400000 ms = 24 hours
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.attendance.system=INFO
logging.level.org.springframework.security=WARN
